# Build and push this fork to GitHub Container Registry (GHCR).
#
# Uses the built-in GITHUB_TOKEN — no Docker Hub password/secret required.
# Runs only on Helvio88/babybuddy (never upstream).
#
# Image:
#   ghcr.io/helvio88/babybuddy:latest
#   ghcr.io/helvio88/babybuddy:sha-<short>
#   ghcr.io/helvio88/babybuddy:<git-tag>

name: Docker Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    if: github.repository == 'Helvio88/babybuddy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image summary
        run: |
          {
            echo "### GitHub Container Registry"
            echo ""
            echo "Pushed with \`GITHUB_TOKEN\` (no Docker Hub password)."
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull example:"
            echo '```'
            echo "docker pull ghcr.io/helvio88/babybuddy:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
